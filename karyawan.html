<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Karyawan - HADIRIN By RB</title><link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg"><link rel="icon" href="/assets/images/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<script src="/assets/js/guard.js"></script>
<link rel="stylesheet" href="/assets/libs/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/assets/libs/bootstrap-icons/bootstrap-icons.css"><link rel="stylesheet" href="/assets/css/main.css"><link rel="stylesheet" href="/assets/css/hadirin.css"></head><body>
<div id="app-content">
<div class="page-header"><div><h1 class="page-title">Karyawan</h1><p class="page-subtitle">Kelola karyawan dan admin, serta akses login.</p></div>
<button class="btn-custom btn-custom-primary" id="btn-add"><i class="bi bi-person-plus-fill"></i> Tambah Karyawan</button></div>
<div class="table-card-custom"><div class="table-header-control"><div class="table-search-box"><i class="bi bi-search table-search-icon"></i><input type="text" id="q" class="table-search-input" placeholder="Cari nama atau NIP..."></div>
<div class="table-filter-group"><div class="dropdown"><button class="btn-table-action dropdown-toggle" type="button" id="fbtn" data-bs-toggle="dropdown" aria-expanded="false"><i class="bi bi-funnel"></i> Semua Status</button><ul class="dropdown-menu" id="fmenu"><li><a class="dropdown-item" href="#" data-v="">Semua Status</a></li><li><a class="dropdown-item" href="#" data-v="1">Aktif</a></li><li><a class="dropdown-item" href="#" data-v="0">Nonaktif</a></li></ul></div></div></div>
<div class="table-responsive"><table class="table-custom"><thead><tr><th>Karyawan</th><th>Telepon</th><th>Status</th><th class="text-center">Aksi</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="table-footer-control"><span class="table-pagination-info" id="info"></span><nav aria-label="Page navigation"><ul class="pagination mb-0 gap-1" id="pg"></ul></nav></div></div>

<div class="modal fade" id="m" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><form class="modal-content p-4" id="f"><h5 class="card-title mb-4" id="mt"></h5><div class="mb-3"><label for="full_name" class="form-label-custom">Nama lengkap</label><input type="text" id="full_name" class="form-control-custom" required></div><div class="mb-3"><label for="nip" class="form-label-custom">NIP / ID Karyawan</label><input type="text" id="nip" class="form-control-custom" readonly tabindex="-1" autocomplete="off"><div class="form-text">Dibuat otomatis dan tidak dapat diubah.</div></div><div class="mb-3"><label for="position" class="form-label-custom">Jabatan</label><select id="position" class="form-control-custom form-select"><option value="Karyawan">Karyawan</option><option value="Admin">Admin</option></select><div class="form-text">Admin dapat masuk ke dashboard ini; Karyawan memakai aplikasi absen.</div></div><div class="mb-3"><label for="phone" class="form-label-custom">Telepon</label><input type="text" id="phone" class="form-control-custom" ></div><div class="mb-3"><label for="email" class="form-label-custom">Email (login app)</label><input type="email" id="email" class="form-control-custom" required></div><div class="mb-3"><label for="password" class="form-label-custom">Password</label><input type="password" id="password" class="form-control-custom" ></div><small class="text-muted d-block mb-3" id="pwhint"></small>
<div class="form-switch-custom mb-4"><input class="form-switch-input-custom" type="checkbox" id="active" checked><label class="form-switch-label" for="active">Akun aktif</label></div>
<div class="d-flex gap-2"><button class="btn-custom btn-custom-primary" type="submit">Simpan</button><button class="btn-custom btn-custom-light" type="button" data-bs-dismiss="modal">Batal</button></div></form></div></div>
<div class="modal fade" id="mv" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-4"><div class="text-center mb-3"><div class="avatar-letter avatar-lg" id="v-av"></div><h5 class="card-title mb-1" id="v-name"></h5><div class="text-muted small" id="v-sub"></div></div><div id="v-body" class="mb-4"></div><div class="d-flex gap-2"><button class="btn-custom btn-custom-light" type="button" data-bs-dismiss="modal">Tutup</button></div></div></div></div></div>
<script src="/assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script><script src="/assets/libs/supabase/supabase.js"></script><script src="/config.js"></script><script src="/assets/js/core.js"></script><script src="/assets/js/hours.js"></script><script src="/assets/js/pages/karyawan.js"></script>
<script>bootAdmin('karyawan')</script></body></html>
