<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Keterangan - HADIRIN By RB</title><link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg"><link rel="icon" href="/assets/images/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">

<link rel="stylesheet" href="/assets/libs/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/assets/libs/bootstrap-icons/bootstrap-icons.css"><link rel="stylesheet" href="/assets/css/main.css"><link rel="stylesheet" href="/assets/css/hadirin.css"></head><body>
<div id="app-content">
<div class="page-header"><div><h1 class="page-title">Keterangan</h1><p class="page-subtitle">Pengajuan izin dan sakit dari karyawan.</p></div></div>
<div class="table-card-custom"><div class="table-header-control"><div class="table-search-box"><i class="bi bi-search table-search-icon"></i><input type="text" id="q" class="table-search-input" placeholder="Cari nama karyawan..."></div>
<div class="table-filter-group"><div class="dropdown"><button class="btn-table-action dropdown-toggle" type="button" id="fbtn" data-bs-toggle="dropdown" aria-expanded="false"><i class="bi bi-funnel"></i> Semua Status</button><ul class="dropdown-menu" id="fmenu"><li><a class="dropdown-item" href="#" data-v="">Semua Status</a></li><li><a class="dropdown-item" href="#" data-v="pending">Menunggu</a></li><li><a class="dropdown-item" href="#" data-v="approved">Disetujui</a></li><li><a class="dropdown-item" href="#" data-v="rejected">Ditolak</a></li></ul></div></div></div>
<div class="table-responsive"><table class="table-custom"><thead><tr><th>Karyawan</th><th>Jenis</th><th>Tanggal</th><th>Status</th><th class="text-center">Aksi</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="table-footer-control"><span class="table-pagination-info" id="info"></span><nav aria-label="Page navigation"><ul class="pagination mb-0 gap-1" id="pg"></ul></nav></div></div>

<div class="modal fade" id="m" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-4"><h5 class="card-title mb-3" id="d-name"></h5><div id="d-body" class="mb-4"></div>
<div class="d-flex gap-2" id="d-act"><button class="btn-custom btn-custom-primary" data-s="approved">Setujui</button><button class="btn-custom btn-custom-danger" data-s="rejected">Tolak</button><button class="btn-custom btn-custom-light" data-bs-dismiss="modal">Tutup</button></div></div></div></div>
<div class="modal fade" id="me" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><form class="modal-content p-4" id="fe"><h5 class="card-title mb-4">Edit Pengajuan</h5>
<div class="mb-3"><label for="e-name" class="form-label-custom">Karyawan</label><input type="text" id="e-name" class="form-control-custom" readonly></div>
<div class="row g-2 mb-3"><div class="col-6"><label for="e-type" class="form-label-custom">Jenis</label><select id="e-type" class="form-control-custom form-select"><option value="izin">Izin</option><option value="sakit">Sakit</option></select></div><div class="col-6"><label for="e-status" class="form-label-custom">Status</label><select id="e-status" class="form-control-custom form-select"><option value="pending">Menunggu</option><option value="approved">Disetujui</option><option value="rejected">Ditolak</option></select></div></div>
<div class="row g-2 mb-3"><div class="col-6"><label for="e-start" class="form-label-custom">Mulai</label><input type="date" id="e-start" class="form-control-custom" required></div><div class="col-6"><label for="e-end" class="form-label-custom">Selesai</label><input type="date" id="e-end" class="form-control-custom" required></div></div>
<div class="mb-4"><label for="e-reason" class="form-label-custom">Alasan</label><textarea id="e-reason" rows="3" class="form-control-custom"></textarea></div>
<div class="d-flex gap-2"><button class="btn-custom btn-custom-primary" type="submit">Simpan</button><button class="btn-custom btn-custom-light" type="button" data-bs-dismiss="modal">Batal</button></div></form></div></div></div>
